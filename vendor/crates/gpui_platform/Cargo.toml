# [FastFiler vendor 改変] Windows 専用に整理。
# macOS/Linux/wasm 向けの依存 (gpui_macos / gpui_linux / gpui_web) は vendor していない
# ため除去。それらを参照していた feature は no-op として名前だけ残し、外部からの
# `gpui_platform/font-kit` 等の参照が壊れないようにしている。
# (元の zed/crates/gpui_platform/Cargo.toml はクロスプラットフォーム構成)
[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
# 以下は非 Windows 専用機能。Windows vendor では no-op (名前のみ保持)。
font-kit = []
runtime_shaders = []
wayland = []
x11 = []
test-support = ["gpui/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_windows/screen-capture"]

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
gpui = { workspace = true, features = ["windows-manifest"] }

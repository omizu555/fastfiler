[package]
name = "fastfiler-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FastFiler — 高速な Windows ファイラ (iced GUI)"

[[bin]]
name = "fastfiler"
path = "src/main.rs"

[dependencies]
# 0.14.0 ピン留め (計画書 §2: IME 初対応がこの版。破壊的変更を避けるため = 指定)。
# image は "image-without-codecs" — アプリが渡すのは自前生成の PNG (icons.rs) のみで、
# 既定の "image" だと AV1 エンコーダ (rav1e) を含む全コーデック ~30 依存を引き込む
iced = { version = "=0.14.0", features = [
    "advanced",
    "tokio",
    "image-without-codecs",
    "advanced-shaping",
] }
fastfiler-core = { path = "../fastfiler-core" }
fastfiler-win = { path = "../fastfiler-win" }
fastfiler-domain = { path = "../fastfiler-domain" }
async-channel = "2.5"
serde.workspace = true
serde_json.workspace = true
# 自動クローズ・スパイクのタイマー用 (iced の executor も tokio)
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[dev-dependencies]
iced_test = "0.14.0"

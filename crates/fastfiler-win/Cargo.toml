[package]
name = "fastfiler-win"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "FastFiler の HWND を要する Win32 統合 (OLE 受信 / 多重起動 / ウィンドウ連携)"

[dependencies]
fastfiler-domain = { path = "../fastfiler-domain" }
# iced の re-export (iced::window::raw_window_handle) と同一メジャー。cargo が単一 0.6 に統一する
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# domain と同じ 0.58 に揃える (HWND/POINTL の型を共有するため。計画書 §10-5 で統一予定)
windows = { version = "0.58", features = ["Win32_Foundation"] }

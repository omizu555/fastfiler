[package]
name = "fastfiler-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "FastFiler の Tauri 非依存ドメインロジック (Phase 2B 段階移行中)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
] }

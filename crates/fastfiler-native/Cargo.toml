[package]
name = "fastfiler-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "FastFiler native (floem-based) GUI — Phase 3 minimal explorer"

[[bin]]
name = "fastfiler-native"
path = "src/main.rs"

[dependencies]
fastfiler-domain = { path = "../fastfiler-domain" }
floem = "0.2"
im = "15"
parking_lot = "0.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[package]
name = "fastfiler-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "FastFiler native (floem-based) GUI — Phase 3 minimal explorer"

[[bin]]
name = "fastfiler-native"
path = "src/main.rs"

[features]
# メモリ調査用の計装を有効化する (live カウンタ + counting allocator + 周期ログ)。
# 通常ビルドは OFF。release でも `--features mem-debug` で有効化できる。
mem-debug = []
# dhat ヒーププロファイラを有効化する (アロケーション元のコールスタック付きで
# 終了時に dhat-heap.json を出力)。リークの発生箇所を特定するための調査用。
# mem-debug とは排他 (両方指定した場合は dhat-heap を優先)。
dhat-heap = ["dep:dhat"]

[dependencies]
fastfiler-domain = { path = "../fastfiler-domain" }
floem = "0.2"
dhat = { version = "0.3", optional = true }
im = "15"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Security"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"


[package]
name = "fastfiler-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "FastFiler native (floem-based) GUI — Phase 3 minimal explorer"

[[bin]]
name = "fastfiler-native"
path = "src/main.rs"

[dependencies]
fastfiler-domain = { path = "../fastfiler-domain" }
floem = "0.2"
im = "15"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

